                guideTitle: 'User Guide',
                modalTitle: 'How to use Yeopjeon Dosirak',
                stepPrefix: 'STEP',
                steps: [
                    { title: 'Buy Yeopjeon', desc: 'Purchase Yeopjeon coins at the Dosirak Cafe.', box: '20 Yeopjeon = 10,000 KRW\n(1 Yeopjeon = 500 KRW)', note: '💡 You can also rent a lunchbox here!' },
                    { title: 'Find Shops', desc: 'Look for shops that accept Yeopjeon.', box: 'Available at shops with a guide banner.\n(Mostly food stalls)', note: '💡 You can see shop locations on the Map tab!' },

                    { title: 'Enjoy Your Meal', desc: 'Return to the cafe, add rice and soup, and enjoy!', box: 'Cafe Rice, Soup = 2 Yeopjeon each\n(1,000 KRW each)', note: '💡 Microwaves and utensils are available in the cafe!' }

            },
            zh: {

                    { title: '寻找加盟店', desc: '逛市场时寻找可以使用铜钱的加盟店。', box: '在有指南横幅的店铺可以使用。\n(主要是食品店)', note: '💡 您可以在地图选项卡上一目了然地看到位置！' },
                    { title: '购买食物', desc: '用铜钱购买您喜欢的食物，装满便当。', box: '每个小菜所需的铜钱数量不同。\n(通常1~2个)', note: '💡 如果铜钱不够，也可以用现金支付。' },
                    { title: '享用美食', desc: '回到咖啡厅，加上米饭和汤，开始享用吧！', box: '咖啡厅米饭、汤 = 各2个铜钱\n(各1,000韩元)', note: '💡 咖啡厅内备有微波炉和餐具！' }
                ]
            },
            ja: {
                guideTitle: 'ご利用ガイド',
                modalTitle: 'ヨプジョン弁当の利用方法',
                stepPrefix: 'STEP',
                steps: [
                    { title: 'ヨプジョンの購入', desc: '通仁市場の弁当カフェでヨプジョン（真鍮貨）を購入します。', box: '20ヨプジョン = 10,000ウォン\n(1ヨプジョン = 500ウォン)', note: '💡 お弁当箱も一緒にレンタルできます！' },
                    { title: '加盟店を探す', desc: '市場を巡りながらヨプジョンが使える加盟店を探します。', box: '案内バナーがある店舗で利用可能です。\n(ほとんどの飲食店)', note: '💡 地図タブで加盟店の位置が一目でわかります！' },
                    { title: '食べ物を買う', desc: '好きな食べ物をヨプジョンで買って、お弁当箱を埋めます。', box: 'おかずによって必要なヨプジョンの数が異なります。\n(通常1〜2個)', note: '💡 ヨプジョンが足りない場合は現金での支払いも可能です。' },
                    { title: '美味しく食べる', desc: '弁当カフェに戻り、ご飯とスープを追加して食事をします。', box: 'カフェのご飯、スープ = 各2ヨプジョン\n(各1,000ウォン)', note: '💡 カフェには電子レンジやスプーン・箸が用意されています！' }
                ]
            }
        };

        const Step = {
            LANDING: 0,
            PURPOSE: 1,
            COMPANION: 2,
            INTEREST: 3,
            PREFERENCE: 4,
            RECOMMENDATION: 5,
        };

        const TOTAL_STEPS = 4;

        // --- Service ---
        const parseCSV = (text) => {
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const rows = text.split('\n').filter(line => line.trim());
            const parsedRows = rows.map(line => {
                const parts = []; let current = ''; let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuote = !inQuote; continue; }
                    if (char === ',' && !inQuote) { parts.push(current.trim()); current = ''; continue; }
                    current += char;
                }
                parts.push(current.trim());
                return parts;
            });
            const cleaned = parsedRows.map(row => row.map(cell => cell.replace(/\r/g, '').trim()));
            const header = cleaned[0];
            if (!header) return [];
            return cleaned.slice(1).map(row => {
                const obj = {};
                header.forEach((h, i) => { obj[h] = row[i]; });
                return obj;
            });
        };

        const fetchWithTimeout = async (url, options = {}, timeoutMs = 1800) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timeoutId);
            }
        };

        const fetchStoreList = async () => {
            try {
                let res = null;
                try {
                    res = await fetchWithTimeout(CSV_URL, { cache: 'no-store' });
                } catch (sheetError) {
                    console.info("Google Sheet fetch skipped, using local CSV:", sheetError.message);
                }

                if (!res || !res.ok) {
                    res = await fetch('stores_data.csv', { cache: 'no-store' });
                }

                const text = await res.text();
                const rawData = parseCSV(text);
                if (!rawData.length) return [];
                const getVal = (row, keys) => {
                    for (const key of keys) {
                        const lowerKey = key.toLowerCase();
                        const actualKey = Object.keys(row).find(k => k.toLowerCase() === lowerKey);
                        if (actualKey && row[actualKey]) return row[actualKey].trim();
                    }
                    return "";
                };
                const seen = new Set();
                const stores = rawData.map(row => {
                    const rawCat = getVal(row, ['category', '분류']);
                    let cat = "생활형";
                    if (/식당/.test(rawCat)) cat = "식당";
                    else if (/(간식|디저트|카페)/.test(rawCat)) cat = "간식";

                    return {
                        name: getVal(row, ['name', '점포명']),
                        description: getVal(row, ['description', 'shortDesc', '설명']),
                        description_eng: getVal(row, ['shortDesc_eng']),
                        description_cn: getVal(row, ['shortDesc_cn']),
                        description_jp: getVal(row, ['shortDesc_jp']),
                        summary: getVal(row, ['summary', '요약']),
                        summary_eng: getVal(row, ['summary_eng']),
                        summary_cn: getVal(row, ['summary_cn']),
                        summary_jp: getVal(row, ['summary_jp']),
                        category: cat,
                        slug: getVal(row, ['slug', '슬러그']),
                        keyword: getVal(row, ['keyword', '키워드']),
                        coin: getVal(row, ['coin', '엽전']),
                        repre_img: getVal(row, ['repre_img', 'repre_image', '대표이미지', 'image']),
                        recommendReason: getVal(row, ['recommendReason', 'recommend_reason', 'recommendDesc', 'recommend_desc', '추천이유', '추천 이유', '추천설명', '추천 설명']),
                        recommendReason_eng: getVal(row, ['recommendReason_eng', 'recommend_reason_eng', 'recommendDesc_eng']),
                        recommendReason_cn: getVal(row, ['recommendReason_cn', 'recommend_reason_cn', 'recommendDesc_cn']),
                        recommendReason_jp: getVal(row, ['recommendReason_jp', 'recommend_reason_jp', 'recommendDesc_jp']),
                        recommendHot: getVal(row, ['recommendHot', 'recommend_hot', 'hotReason', '핫플이유', '핫플 이유']),
                        recommendFirst: getVal(row, ['recommendFirst', 'recommend_first', 'firstVisitReason', '첫방문이유', '첫 방문 이유']),
                        recommendHidden: getVal(row, ['recommendHidden', 'recommend_hidden', 'hiddenReason', '숨은맛집이유', '숨은 맛집 이유']),
                        recommendFast: getVal(row, ['recommendFast', 'recommend_fast', 'fastRouteReason', '빠른동선이유', '빠른 동선 이유'])
                    };
                }).filter(s => s.name).filter(s => {
                    if (seen.has(s.name)) return false;
                    seen.add(s.name);
                    return true;
                });
                return stores;
            } catch (error) {
                console.error("Store list fetch failed:", error);
                return [];
            }
        };

        const normalizeText = (value) => String(value || '').toLowerCase().replace(/\s/g, '');

        const getLocalizedDescription = (store, lang) => {
            const fieldMap = {
                en: 'description_eng',
                zh: 'description_cn',
                ja: 'description_jp'
            };
            return store[fieldMap[lang]] || store.description || store.keyword || '';
        };

        const getLocalizedSummary = (store, lang) => {
            const fieldMap = {
                en: 'summary_eng',
                zh: 'summary_cn',
                ja: 'summary_jp'
            };
            return store[fieldMap[lang]] || store.summary || '';
        };

        const getSheetRecommendationReason = (store, selection, lang) => {
            const langFieldMap = {
                en: 'recommendReason_eng',
                zh: 'recommendReason_cn',
                ja: 'recommendReason_jp'
            };
            const preferenceFieldMap = [
                { matches: ['핫플', 'Hot Place', '热门打卡'], field: 'recommendHot' },
                { matches: ['첫 방문', 'First Visit', '首次访问'], field: 'recommendFirst' },
                { matches: ['숨은 맛집', 'Hidden Gem', '隐秘美食'], field: 'recommendHidden' },
                { matches: ['빠른 동선', 'Efficient', '高效路线'], field: 'recommendFast' }
            ];
            const preferenceMatch = preferenceFieldMap.find(item => item.matches.includes(selection.preference));
            return (preferenceMatch && store[preferenceMatch.field])
                || store[langFieldMap[lang]]
                || store.recommendReason
                || '';
        };

        const getInterestProfiles = (selection) => {
            const selected = selection.interests || [];
            const has = (labels) => selected.some(item => labels.includes(item));
            const profiles = [];

            if (has(['식사', 'Meal', '正餐', '食事'])) {
                profiles.push({
                    category: ['식당'],
                    terms: ['식당', '밥', '식사', '국수', '분식', '떡볶이', '김밥', '만두', '한식', 'meal', 'restaurant', 'noodle', 'tteokbokki']
                });
            }
            if (has(['간식 • 디저트', 'Snack/Dessert', '零食 • 甜点', 'おやつ • デザート'])) {
                profiles.push({
                    category: ['간식'],
                    terms: ['간식', '디저트', '꽈배기', '도너츠', '떡', '빵', '카페', '커피', 'snack', 'dessert', 'doughnut', 'coffee']
                });
            }
            if (has(['전통 먹거리', 'Traditional Food', '传统小吃', '伝統グルメ'])) {
                profiles.push({
                    category: ['간식', '식당'],
                    terms: ['전통', '시장간식', '기름떡볶이', '떡', '엽전', 'traditional', 'market', 'tteok']
                });
            }
            if (has(['구경 • 소품', 'Sightseeing/Goods', '参观 • 纪念品', '見学 • 小物'])) {
                profiles.push({
                    category: ['문화', '잡화', '생활형 점포'],
                    terms: ['구경', '소품', '선물', '기념', '공방', '갤러리', '꽃', '문화', '생활', 'goods', 'gift', 'souvenir', 'craft']
                });
            }

            return profiles;
        };

        const createRecommendationReason = (store, selection, lang) => {
            const summary = getLocalizedSummary(store, lang);
            if (summary) return summary;

            const sheetReason = getSheetRecommendationReason(store, selection, lang);
            if (sheetReason) return sheetReason;

            const base = getLocalizedDescription(store, lang);
            const interest = (selection.interests || []).join(', ');
            const preference = selection.preference || '';
            const messages = {
                ko: `${base} 선택하신 관심사(${interest})와 '${preference}' 방식에 잘 맞는 점포예요.`,
                en: `${base} This spot fits your interests (${interest}) and your "${preference}" recommendation style.`,
                zh: `${base} 这家店很适合您选择的兴趣（${interest}）和「${preference}」推荐方式。`,
                ja: `${base} 選択した関心事（${interest}）と「${preference}」のおすすめスタイルに合うお店です。`
            };
            return messages[lang] || messages.ko;
        };

        const getFastRecommendations = (selection, storeList, lang) => {
            const stores = (storeList || []).filter(store => store.name);
            if (!stores.length) return [];

            const profiles = getInterestProfiles(selection);
            const preferenceText = normalizeText(selection.preference);
            const selectedText = normalizeText([
                selection.purpose,
                selection.companion,
                ...(selection.interests || []),
                selection.preference
            ].join(' '));

            const scored = stores.map((store, index) => {
                const searchable = normalizeText([
                    store.name,
                    store.category,
                    store.description,
                    store.description_eng,
                    store.description_cn,
                    store.description_jp,
                    store.keyword
                ].join(' '));

                let score = 0;

                profiles.forEach(profile => {
                    if (profile.category.some(category => store.category === category)) score += 35;
                    profile.terms.forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 12;
                    });
                });

                if (store.coin && normalizeText(store.coin) === 'o') score += 10;
                if (selectedText.includes('먹거리') || selectedText.includes('food')) {
                    if (['간식', '식당'].includes(store.category)) score += 12;
                }

                if (preferenceText.includes('핫플') || preferenceText.includes('hot') || preferenceText.includes('热门')) {
                    if (store.coin && normalizeText(store.coin) === 'o') score += 14;
                    ['기름떡볶이', '꽈배기', '시장간식', '전통'].forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 10;
                    });
                }

                if (preferenceText.includes('첫방문') || preferenceText.includes('first') || preferenceText.includes('首次')) {
                    if (['간식', '식당'].includes(store.category)) score += 10;
                    if (store.coin && normalizeText(store.coin) === 'o') score += 8;
                }

                if (preferenceText.includes('숨은') || preferenceText.includes('hidden') || preferenceText.includes('隐秘')) {
                    ['수제', '전문', '공방', '직접', '특제', 'specialty', 'craft'].forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 10;
                    });
                }

                if (preferenceText.includes('빠른') || preferenceText.includes('efficient') || preferenceText.includes('高效')) {
                    score += Math.max(0, 18 - index * 0.2);
                }

                return { store, index, score };
            });

            const top = scored
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score || a.index - b.index)
                .slice(0, 4);

            const fallback = scored
                .filter(item => !top.some(topItem => topItem.store.name === item.store.name))
                .filter(item => ['간식', '식당', '문화', '잡화'].includes(item.store.category) || item.store.coin)
                .sort((a, b) => a.index - b.index)
                .slice(0, Math.max(0, 4 - top.length));

            return [...top, ...fallback].slice(0, 4).map(({ store }, index) => ({
                id: `fast-${Date.now()}-${index}`,
                name: store.name,
                description: createRecommendationReason(store, selection, lang),
                slug: store.slug || null,
                checked: false
            }));
        };

        const getRecommendations = async (selection, storeList, lang) => {
            const fastRecommendations = getFastRecommendations(selection, storeList, lang);
            if (fastRecommendations.length) {
                return { data: fastRecommendations, error: "" };
            }

            return {
                data: [],
                error: "\uC810\uD3EC \uB370\uC774\uD130\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4. \uC7A0\uC2DC \uD6C4 \uB2E4\uC2DC \uC2DC\uB3C4\uD574\uC8FC\uC138\uC694."
            };
        };

        // --- Components ---

        const Layout = ({ children, step, totalSteps, title, showProgress = true, lang, setLang, onBack, showBackButton = false, onOpenGuide }) => {
            const progressPercentage = (step / totalSteps) * 100;
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isLangMenuOpen, setIsLangMenuOpen] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    if (window.scrollY > 20) {
                        setIsScrolled(true);
                    } else {
                        setIsScrolled(false);
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const changeLang = (l) => {
                setLang(l);
                setIsLangMenuOpen(false);
                setIsMenuOpen(false);
            };

            const langLabels = { ko: '한국어', en: 'English', zh: '中文', ja: '日本語' };
            const isTransparent = step === 0 && !isScrolled;

            return (
                <div className="min-h-[100dvh] bg-[#F1F5F9] flex justify-center">
                    <div className="w-full max-w-md bg-[#FAFAFA] min-h-[100dvh] shadow-xl flex flex-col relative">
                        <header className={`px-6 pt-[max(1rem,env(safe-area-inset-top))] pb-4 flex justify-between items-center z-50 sticky top-0 transition-all duration-300 ${
                            isTransparent
                                ? 'bg-gradient-to-b from-black/70 via-black/35 to-transparent border-b border-transparent shadow-none -mb-[58px]'
                                : 'bg-white/95 backdrop-blur-md border-b border-gray-100/90 shadow-xs'
                        }`}>
                            <div className="flex items-center gap-3">
                                {showBackButton && onBack && (
                                    <button
                                        onClick={onBack}
                                        className={`w-9 h-9 flex items-center justify-center rounded-full transition-all active:scale-95 ${
                                            isTransparent ? 'hover:bg-white/20 text-white drop-shadow-md' : 'hover:bg-gray-100 text-gray-700'
                                        }`}
                                        aria-label="이전 단계"
                                    >
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
                                        </svg>
                                    </button>
                                )}
                                {step === 0 ? (
                                    <div className="flex items-center gap-2">
                                        <img
                                            src="assets/mjlogo.png"
                                            alt="만장일치 로고"
                                            className={`w-[1.2rem] mt-0.5 h-auto object-contain transition-all duration-300 ${
                                                isTransparent ? 'brightness-0 invert drop-shadow-md' : ''
                                            }`}
                                        />
                                        <span
                                            className={`text-[21px] leading-none outline-none mt-1 transition-colors duration-300 ${
                                                isTransparent ? 'text-white drop-shadow-md' : 'text-gray-900'
                                            }`}
                                            style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}
                                        >
                                            {title || '만장일치'}
                                        </span>
                                    </div>
                                ) : (
                                    <div className={`text-sm font-black uppercase tracking-widest transition-colors duration-300 ${
                                        isTransparent ? 'text-white/90 drop-shadow-md' : 'text-gray-500'
                                    }`}>
                                        {showProgress && step > 0 && step <= totalSteps ? `Step ${step} / ${totalSteps}` : ''}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center gap-1.5 relative">
                                {/* Globe Language Selector */}
                                <div className="relative">
                                    <button
                                        onClick={() => setIsLangMenuOpen(!isLangMenuOpen)}
                                        className={`p-1.5 rounded-full transition-all active:scale-95 ${
                                            isTransparent ? 'bg-black/20 hover:bg-black/40 text-white drop-shadow-md backdrop-blur-xs' : 'hover:bg-gray-100 text-[#A68A64]'
                                        }`}
                                        aria-label="언어 변경"
                                    >
                                        <Globe className={`w-5.5 h-5.5 ${isTransparent ? 'text-white' : 'text-[#A68A64]'}`} />
                                    </button>

                                    {isLangMenuOpen && (
                                        <div className="absolute right-0 top-full mt-2 w-32 bg-white rounded-2xl shadow-xl border border-gray-200/80 overflow-hidden z-[130] animate-in fade-in zoom-in-95 duration-150">
                                            {Object.entries(langLabels).map(([key, label]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => changeLang(key)}
                                                    className={`w-full text-left px-4 py-3 text-xs font-bold transition-colors ${lang === key ? 'text-[#A68A64] bg-[#FDFBF7]' : 'text-gray-600 hover:bg-gray-50'}`}
                                                >
                                                    {label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </header>

                        {showProgress && step > 0 && step <= totalSteps && (
                            <div className="px-6 pb-6">
                                <div className="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
                                    <div
                                        className={`h-full bg-[#A68A64] transition-all duration-300 ease-out`}
                                        style={{ width: `${progressPercentage}%` }}
                                    ></div>
                                </div>
                            </div>
                        )}

                        <main className="flex-1 px-6 pb-20 overflow-y-auto no-scrollbar flex flex-col">
                            {children}
                        </main>
                    </div>
                </div>
            );
        };

        const SelectionButton = ({ selected, onClick, children, className = "" }) => {
            return (
                <button
                    onClick={onClick}
                    className={`
              w-full aspect-square flex flex-col items-center justify-center rounded-2xl border transition-all duration-200
              ${selected
                            ? 'border-[#A68A64] bg-[#FDFBF7] text-[#A68A64] ring-1 ring-[#A68A64]'
                            : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'
                        }
              ${className}
            `}
                >
                    {children}
                </button>
            );
        };

        const NextButton = ({ onClick, disabled = false, label = "다음", variant = 'secondary' }) => {
            const baseClasses = "w-full py-4 rounded-xl font-medium text-lg transition-colors";
            const variants = {
                primary: "bg-[#A68A64] text-white hover:bg-[#8D7350]",
                secondary: "bg-[#E6E0D4] text-gray-700 hover:bg-[#D9D1C1] disabled:opacity-50 disabled:cursor-not-allowed"
            };

            return (
                <div className="fixed bottom-0 w-full max-w-md bg-white px-6 pt-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] border-t border-gray-50 left-0 right-0 mx-auto z-20">
                    <button

            const extendedSlides = [slides[slides.length - 1], ...slides, slides[0]];
            const scrollContainerRef = React.useRef(null);
            const [isPlaying, setIsPlaying] = useState(true);

            useEffect(() => {
                const container = scrollContainerRef.current;
                if (!container) return;

                const initScroll = () => {
                    if (container.clientWidth > 0) {
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = container.clientWidth;
                        container.style.scrollBehavior = "smooth";
                    }
                };

                requestAnimationFrame(initScroll);

                let isFixing = false;
                const handleScroll = () => {
                    if (isFixing) return;
                    const width = container.clientWidth;
                    const scrollLeft = container.scrollLeft;

                    if (width === 0) return;

                    const maxScroll = width * (extendedSlides.length - 1);

                    if (scrollLeft <= 5) {
                        isFixing = true;
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = width * slides.length;
                        requestAnimationFrame(() => {
                            container.style.scrollBehavior = "smooth";
                            isFixing = false;
                        });
                    } else if (scrollLeft >= maxScroll - 5) {
                        isFixing = true;
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = width;
                        requestAnimationFrame(() => {
                            container.style.scrollBehavior = "smooth";
                            isFixing = false;
                        });
                    }
                };

                container.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('resize', initScroll);
                return () => {
                    container.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', initScroll);
                };
            }, []);

                const container = scrollContainerRef.current;
                if (container) {
                    container.scrollBy({ left: -container.clientWidth, behavior: 'smooth' });
                }

            const handleBack = () => setStep(prev => Math.max(prev - 1, Step.LANDING));
            const handleReset = () => {

            };

            const updateSelection = (field, value) => {
                track('recommendation_option_select', {
                    step_name: field,
                    option_value: Array.isArray(value) ? value.join('|') : value
                });
                setSelection(prev => ({ ...prev, [field]: value }));
            };

            const handleInterestToggle = (value) => {
                setSelection(prev => {
                    const current = prev.interests;
                    if (current.includes(value)) return { ...prev, interests: current.filter(i => i !== value) };
                    if (current.length >= 3) return prev;
                    return { ...prev, interests: [...current, value] };

            useEffect(() => {
                let mounted = true;
                fetchStoreList().then((list) => {
                    if (mounted) setStoreList(list);

                    if (mounted) setErrorMessage('데이터를 불러오지 못했습니다. 다시 시도해주세요.');
                });
                return () => { mounted = false; };
            }, []);

            // Loading Effect
            useEffect(() => {
                if (!loading) return;
                setProgress(0);
                setCurrentMessageIndex(0);

                const progressInterval = setInterval(() => {
                    setProgress(prev => {
                        if (prev >= 90) return prev;
                        const diff = Math.random() * 5 + 7;
                        return Math.min(prev + diff, 90);
                    });
                }, 200);

                const messageInterval = setInterval(() => {
                    setCurrentMessageIndex(prev => (prev + 1) % LOADING_MESSAGES[lang].length);
                }, 2500);

                return () => {
                    clearInterval(progressInterval);
                    clearInterval(messageInterval);
                };
            }, [loading, lang]);

            const fetchRecommendations = useCallback(async (nextSelection = selection) => {
                setLoading(true);
                setErrorMessage('');
                setStep(Step.RECOMMENDATION);

                track('recommendation_start', {
                    purpose: nextSelection.purpose,
                    companion: nextSelection.companion,
                    interests: nextSelection.interests.join('|'),
                    preference: nextSelection.preference
                });

                                            key={cat.value}
                                            onClick={() => setSelectedCategory(cat.value)}
                                            className={`shrink-0 px-4 py-1.5 rounded-full text-[13px] font-bold transition-all ${selectedCategory === cat.value ? 'bg-[#A68A64] text-white shadow-xs' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                        >
                                            {cat.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Store Cards Horizontal List */}
                                <div className="flex gap-3 overflow-x-auto no-scrollbar pt-2 pb-2">
                                    {filteredStores.map(store => {
                                        const rawImg = store.repre_img || store.repre_image || '';
                                        let imgUrl = rawImg;
                                        if (rawImg.includes('drive.google.com')) {
                                            const match = rawImg.match(/\/d\/([^/]+)/);
                                            if (match && match[1]) {
                                                imgUrl = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
                                            }
                                        }
                                        return (
                                            <div key={store.id} onClick={() => setSelectedStore(store)} className="shrink-0 w-[165px] bg-white rounded-2xl border border-gray-200/80 overflow-hidden cursor-pointer hover:border-[#A68A64] active:scale-[0.98] transition-all shadow-2xs">
                                                <div className="h-[115px] bg-gray-100 flex items-center justify-center overflow-hidden relative">
                                                    {imgUrl ? (
                                                        <img
                                                            src={imgUrl}
                                                            alt={store.name}
                                                            className="w-full h-full object-cover"
                                                            onError={(e) => {
                                                                e.target.style.display = 'none';
                                                                if (e.target.nextElementSibling) e.target.nextElementSibling.style.display = 'flex';
                                                            }}
                                                        />
                                                    ) : null}
                                                    <div className={`w-full h-full flex items-center justify-center ${imgUrl ? 'hidden' : ''}`}>
                                                        <span className="text-3xl">{store.category === '식당' ? '🍲' : store.category === '간식' ? '🥨' : '🏪'}</span>
                                                    </div>
                                                </div>
                                                <div className="p-3 space-y-1">
                                                    <div className="text-[10px] text-[#b5926b] font-bold">{store.category}</div>
                                                    <div className="font-bold text-[13.5px] text-gray-900 truncate">{store.name}</div>
                                                    <div className="text-[11px] text-gray-500 truncate">{store.description || store.keywords}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {filteredStores.length === 0 && (
                                        <div className="w-full text-center py-6 text-sm text-gray-400">{t.noStoreInCategory}</div>
                                    )}
                                </div>
                            </div>

                            {/* Section Divider Bar */}
                            <div className="h-2.5 bg-gray-100/90 -mx-6"></div>

                            {/* 통인시장 근처 코스 Section (인스타그램 연동 & 슬라이드 썸네일) */}
                            <div className="-mx-6 px-6 py-6 bg-white space-y-4">
                                <div className="text-center space-y-1">
                                    <h3 className="text-lg font-extrabold text-gray-900 tracking-tight">{t.sectionCourse}</h3>
                                    <div className="w-6 h-0.5 bg-[#A68A64]/40 mx-auto"></div>
                                </div>

                                {/* Continuous Auto-Sliding Story Thumbnails (마우스 호버 시 일시정지) */}
                                <CourseSlider />
                            </div>

                            {/* Section Divider Bar */}
                            <div className="h-2.5 bg-gray-100/90 -mx-6"></div>

                            {/* Footer - Full Bleed */}
                            <footer className="mt-auto pt-8 pb-24 bg-gray-50 border-t border-gray-200/80 -mx-6 px-6 text-gray-500">
                                <div className="space-y-4">
                                    {/* Brand Header */}
                                    <div className="flex items-center gap-2">
                                        <img src="assets/mjlogo.png" alt="만장일치 로고" className="w-4 h-auto object-contain opacity-80" />
                                        <span className="font-bold text-gray-800 text-sm" style={{ fontFamily: 'Jandari' }}>만장일치 (萬場一致)</span>
                                    </div>

                                    {/* Info Text */}
                                    <div className="space-y-1 text-gray-500 leading-relaxed text-[11px]">
                                        <p className="font-medium text-gray-700">{t.footerDesc}</p>
                                        <p>{t.footerAddr}</p>
                                        <p>{t.footerHours}</p>
                                        <p>{t.footerContact}</p>
                                    </div>

                                    {/* Links & Copyright */}
                                    <div className="pt-3 border-t border-[#E8DEC9]/60 flex flex-col gap-2">
                                        <div className="flex gap-3 text-[11px] text-gray-600 font-medium">
                                            <a href="map.html" className="hover:text-[#A68A64] transition-colors">{t.footerLinkMap}</a>
                                            <span>·</span>
                                            <a href="markets.html" className="hover:text-[#A68A64] transition-colors">{t.footerLinkGuide}</a>
                                            <span>·</span>
                                            <a href="markets.html?view=facilities" className="hover:text-[#A68A64] transition-colors">{t.footerLinkFacility}</a>
                                        </div>
                                        <p className="text-[10px] text-gray-400">© 2026 만장일치 (Manjanilchi). All rights reserved.</p>
                                    </div>
                                </div>
                            </footer>
                        </div>

                        {/* Bottom Navigation Bar */}
                        <nav id="globalNavBar" className="fixed bottom-0 left-0 right-0 z-[60] flex justify-center pointer-events-none transition-transform duration-300">
                            <div className="w-full max-w-md bg-white border-t border-gray-100 flex justify-around items-center pb-[max(0.25rem,env(safe-area-inset-bottom))] pt-1.5 px-2 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] pointer-events-auto">
                                <button className="flex flex-col items-center gap-0.5 p-1.5 text-gray-900 font-bold transition-colors">
                                    <svg className="w-5 h-5 text-[#A68A64]" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
                                    <span className="text-[9px] font-bold text-[#A68A64]">{t.navHome}</span>
                                </button>
                                <button onClick={() => window.location.href = 'stores.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <Store className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">{t.navStore}</span>
                                </button>
                                <button onClick={() => window.location.href = 'map.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <MapPin className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">{t.navMap}</span>
                                </button>
                                <button onClick={() => window.location.href = 'markets.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <Coins className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">{t.navYeopjeon}</span>
                                </button>
                                <button onClick={() => window.location.href = 'markets.html?view=facilities'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <Users className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">{t.navFacility}</span>
                                </button>
                            </div>
                        </nav>
                    </>
                )
            };

            const renderStep1 = () => (
                <div className="py-6 space-y-8">
                    <div>
                        <h2 className="text-2xl font-normal text-gray-900 mb-2 whitespace-pre-wrap leading-tight" style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}>{t.step1Title}</h2>
                        <p className="text-gray-500 text-base">{t.step1Desc}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {t.step1Opts.map((item) => (
                            <SelectionButton key={item.label} selected={selection.purpose === item.label} onClick={() => updateSelection('purpose', item.label)}>
                                <div className="mb-2 text-[#A68A64]">
                                    <item.Icon className="w-6 h-6" strokeWidth={3} />
                                </div>
                                <span className="font-bold text-lg">{item.label}</span>
                            </SelectionButton>
                        ))}
                    </div>
                    <NextButton onClick={handleNext} disabled={!selection.purpose} label={t.next} />
                </div>
            );

            const renderStep2 = () => (
                <div className="py-6 space-y-8">
                    <div>
                        <h2 className="text-2xl font-normal text-gray-900 mb-2 whitespace-pre-wrap leading-tight" style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}>{t.step2Title}</h2>
                        <p className="text-gray-500 text-base">{t.step2Desc}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {t.step2Opts.map((item) => (
                            <SelectionButton key={item.label} selected={selection.companion === item.label} onClick={() => updateSelection('companion', item.label)}>
                                <div className={`mb-2 ${item.color || 'text-[#A68A64]'}`}>
                                    <item.Icon className="w-6 h-6" strokeWidth={3} />
                                </div>
                                <span className="font-bold text-lg">{item.label}</span>
                            </SelectionButton>
                        ))}
                    </div>
                    <NextButton onClick={handleNext} disabled={!selection.companion} label={t.next} />
                </div>
            );

            const renderStep3 = () => (
                <div className="py-6 space-y-8">
                    <div>
                        <h2 className="text-2xl font-normal text-gray-900 mb-2 whitespace-pre-wrap leading-tight" style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}>{t.step3Title}</h2>
                        <p className="text-gray-500 text-base">{t.step3Desc}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {t.step3Opts.map((item) => (
                            <SelectionButton key={item.label} selected={selection.interests.includes(item.label)} onClick={() => handleInterestToggle(item.label)} className="aspect-[4/3]">
                                <div className="mb-2 text-[#A68A64]">
                                    <item.Icon className="w-6 h-6" strokeWidth={3} />
                                </div>
                                <span className="font-bold text-lg">{item.label}</span>
                            </SelectionButton>
                        ))}
                    </div>
                    <NextButton onClick={handleNext} disabled={selection.interests.length === 0} label={t.next} />
                </div>
            );

            const renderStep4 = () => (
                <div className="py-6 space-y-8">
                    <div>
                        <h2 className="text-2xl font-normal text-gray-900 mb-2 leading-tight" style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}>{t.step4Title}</h2>
                        <p className="text-gray-500 text-base">{t.step4Desc}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {t.step4Opts.map((item) => (
                            <SelectionButton key={item.id} selected={selection.preference === item.id} onClick={() => {
                                const nextSelection = { ...selection, preference: item.id };
                                track('recommendation_option_select', {
                                    step_name: 'preference',
                                    option_value: item.id
                                });
                                setSelection(nextSelection);
                                fetchRecommendations(nextSelection);
                            }}>
                                <div className="mb-2 text-[#A68A64]">
                                    <item.Icon className="w-6 h-6" strokeWidth={3} />
                                </div>
                                <span className="font-bold text-lg text-center leading-tight">{item.label}</span>
                            </SelectionButton>
                        ))}
                    </div>
                </div>
            );

            const renderRecommendation = () => {
                if (loading) {
                    return (
                        <div className="h-full flex flex-col items-center justify-center px-6">
                            <div className="w-full max-w-[240px] mb-8 relative">
                                <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                                    <div
                                        className="h-full bg-[#A68A64] transition-all duration-500 ease-out"
                                        style={{ width: `${progress}%` }}
                                    ></div>
                                </div>
                                <p className="text-right text-xs text-[#A68A64] font-bold mt-2">{Math.round(progress)}%</p>
                            </div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2 text-center animate-pulse">
                                {LOADING_MESSAGES[lang][currentMessageIndex]}
                            </h3>
                        </div>
                    );
                }

                if (errorMessage) {
                    return (
                        <div className="h-full flex flex-col items-center justify-center space-y-4 text-center px-6">
                            <p className="text-gray-600">{t.recError}</p>
                            <button
                                onClick={fetchRecommendations}
                                className="px-5 py-2.5 rounded-lg bg-[#A68A64] text-white text-sm font-medium"
                            >
                                {t.recRetry}
                            </button>
                            {errorMessage && (
                                <div className="mt-8 p-4 bg-red-50 rounded-2xl border border-red-100">
                                    <p className="text-red-600 text-sm font-bold mb-2">Error Details</p>
                                    <pre className="text-red-500 text-[10px] leading-tight whitespace-pre-wrap break-all font-mono opacity-80">{errorMessage}</pre>
                                    <button
                                        onClick={fetchRecommendations}
                                        className="mt-4 w-full py-3 bg-red-100 text-red-700 rounded-xl font-bold text-sm active:scale-95 transition-all"
                                    >
                                        {t.recRetry}
                                    </button>
                                </div>
                            )}
                        </div>
                    );
                }

                const handleOpenMap = () => {
                    const selectedStores = recommendations.filter((store) => store.checked);
                    const firstRec = recommendations[0];

                    track('recommendation_map_open', {
                        selected_count: selectedStores?.length || 0,
                        recommended_count: recommendations?.length || 0,
                        target_store: firstRec?.name || ''
                    });

                    // Auto-Favorites Logic
                    try {
                        const currentFavs = new Set(JSON.parse(localStorage.getItem('tongin_favs') || '[]'));
                        recommendations.forEach(r => currentFavs.add(r.name));
                        localStorage.setItem('tongin_favs', JSON.stringify(Array.from(currentFavs)));
                    } catch (e) { console.error("Auto-fav failed", e); }

                    if (selectedStores.length === 0) {
                        // No selection - show first recommendation
                        if (!firstRec) {
                            window.location.href = 'map.html';
                            return;
                        }
                        window.location.href = firstRec.slug ? `shop/${encodeURIComponent(firstRec.slug)}` : `map.html?open=${encodeURIComponent(firstRec.name)}`;
                    } else if (selectedStores.length === 1) {
                        // Single selection - open detail panel
                        const selected = selectedStores[0];
                        window.location.href = selected.slug ? `shop/${encodeURIComponent(selected.slug)}` : `map.html?open=${encodeURIComponent(selected.name)}`;
                    } else {
                        // Multiple selections - show all on map
                        const names = selectedStores.map(s => s.name).join(',');
                        window.location.href = `map.html?highlight=${encodeURIComponent(names)}`;
                    }
                };

                return (
                    <div className="pt-4 pb-48">
                        <h2 className="text-2xl font-normal text-gray-900 mb-10 whitespace-pre-wrap leading-tight">{t.recTitle}</h2>
                        <div className="space-y-4">
                            {recommendations.map((store) => (
                                <div
                                    key={store.id}
                                    className={`p-4 border-[2px] rounded-xl flex items-start gap-3 bg-white transition-colors cursor-pointer ${store.checked ? 'border-[#A68A64]' : 'border-gray-200 hover:border-[#A68A64]'}`}
                                    onClick={() => setRecommendations(prev => prev.map(s => s.id === store.id ? { ...s, checked: !s.checked } : s))}
                                >
                                    <div className={`mt-1 w-5 h-5 rounded border flex items-center justify-center flex-shrink-0 ${store.checked ? 'bg-[#A68A64] border-[#A68A64]' : 'border-gray-300'}`}>
                                        {store.checked && <div className="w-2.5 h-2.5 bg-white rounded-sm" />}
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800 text-lg mb-1">[{store.name}]</h3>
                                        <p className="text-sm text-gray-500 leading-relaxed">{store.description}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-white px-6 pt-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] border-t border-gray-50 space-y-3 z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
                            <button
                                onClick={handleOpenMap}
                                className="w-full py-4 bg-[#A68A64] text-white rounded-2xl font-bold text-lg shadow-md active:scale-[0.98] transition-all"
                            >
                                {(() => {
                                    const selectedCount = recommendations.filter(r => r.checked).length;
                                    if (selectedCount === 0) return t.recMapBtn;
                                    if (selectedCount === 1) return t.recMapBtn;
                                    return t.recMapBtnMulti(selectedCount);
                                })()}
                            </button>
                            <button onClick={handleReset} className="w-full py-4 text-gray-400 font-semibold text-sm hover:text-gray-600 transition-colors uppercase tracking-widest">{t.recResetBtn}</button>
                        </div>
                    </div>
                );
            };

            return (
                <Layout
                    step={step}
                    totalSteps={TOTAL_STEPS}
                    title={step === Step.LANDING ? t.title : undefined}
                    showProgress={step !== Step.LANDING && step !== Step.RECOMMENDATION}
                    lang={lang}
                    setLang={setLang}
                    onBack={handleBack}
                    showBackButton={step > Step.LANDING && step < Step.RECOMMENDATION}
                >
                    {step === Step.LANDING && renderLanding()}
                    {step === Step.PURPOSE && renderStep1()}
                    {step === Step.COMPANION && renderStep2()}
                    {step === Step.INTEREST && renderStep3()}
                    {step === Step.PREFERENCE && renderStep4()}
                    {step === Step.RECOMMENDATION && renderRecommendation()}
                    <GuideModal isOpen={isGuideOpen} onClose={() => setIsGuideOpen(false)} lang={lang} setLang={setLang} />
                    <StoreDetailModal store={selectedStore} onClose={() => setSelectedStore(null)} />
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
