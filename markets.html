        const parseCSV = (text) => {
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const rows = text.split('\n').filter(line => line.trim());
            const parsedRows = rows.map(line => {
                const parts = []; let current = ''; let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuote = !inQuote; continue; }
                    if (char === ',' && !inQuote) { parts.push(current.trim()); current = ''; continue; }
                    current += char;
                }
                parts.push(current.trim());
                return parts;
            });
            const cleaned = parsedRows.map(row => row.map(cell => cell.replace(/\r/g, '').trim()));
            const header = cleaned[0];
            if (!header) return [];
            return cleaned.slice(1).map(row => {
                const obj = {};
                header.forEach((h, i) => { obj[h] = row[i]; });
                return obj;
            });
        };

        const fetchWithTimeout = async (url, options = {}, timeoutMs = 1800) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timeoutId);
            }
        };

        const fetchStoreList = async () => {
            try {
                let res = null;
                try {
                    res = await fetchWithTimeout(CSV_URL, { cache: 'no-store' });
                } catch (sheetError) {
                    console.info("Google Sheet fetch skipped, using local CSV:", sheetError.message);
                }

                if (!res || !res.ok) {
                    res = await fetch('stores_data.csv', { cache: 'no-store' });
                }

                const text = await res.text();
                const rawData = parseCSV(text);
                if (!rawData.length) return [];
                const getVal = (row, keys) => {
                    for (const key of keys) {
                        const lowerKey = key.toLowerCase();
                        const actualKey = Object.keys(row).find(k => k.toLowerCase() === lowerKey);
                        if (actualKey && row[actualKey]) return row[actualKey].trim();
                    }
                    return "";
                };
                const seen = new Set();
                const stores = rawData.map(row => ({
                    name: getVal(row, ['name', '점포명']),
                    description: getVal(row, ['description', 'shortDesc', '설명']),
                    description_eng: getVal(row, ['shortDesc_eng']),
                    description_cn: getVal(row, ['shortDesc_cn']),
                    description_jp: getVal(row, ['shortDesc_jp']),
                    summary: getVal(row, ['summary', '요약']),
                    summary_eng: getVal(row, ['summary_eng']),
                    summary_cn: getVal(row, ['summary_cn']),
                    summary_jp: getVal(row, ['summary_jp']),
                    category: getVal(row, ['category', '분류']),
                    slug: getVal(row, ['slug', '슬러그']),
                    keyword: getVal(row, ['keyword', '키워드']),
                    coin: getVal(row, ['coin', '엽전']),
                    recommendReason: getVal(row, ['recommendReason', 'recommend_reason', 'recommendDesc', 'recommend_desc', '추천이유', '추천 이유', '추천설명', '추천 설명']),
                    recommendReason_eng: getVal(row, ['recommendReason_eng', 'recommend_reason_eng', 'recommendDesc_eng']),
                    recommendReason_cn: getVal(row, ['recommendReason_cn', 'recommend_reason_cn', 'recommendDesc_cn']),
                    recommendReason_jp: getVal(row, ['recommendReason_jp', 'recommend_reason_jp', 'recommendDesc_jp']),
                    recommendHot: getVal(row, ['recommendHot', 'recommend_hot', 'hotReason', '핫플이유', '핫플 이유']),
                    recommendFirst: getVal(row, ['recommendFirst', 'recommend_first', 'firstVisitReason', '첫방문이유', '첫 방문 이유']),
                    recommendHidden: getVal(row, ['recommendHidden', 'recommend_hidden', 'hiddenReason', '숨은맛집이유', '숨은 맛집 이유']),
                    recommendFast: getVal(row, ['recommendFast', 'recommend_fast', 'fastRouteReason', '빠른동선이유', '빠른 동선 이유'])
                })).filter(s => s.name).filter(s => {
                    if (seen.has(s.name)) return false;
                    seen.add(s.name);
                    return true;
                });
                return stores;
            } catch (error) {
                console.error("Store list fetch failed:", error);
                return [];
            }
        };

        const normalizeText = (value) => String(value || '').toLowerCase().replace(/\s/g, '');

        const getLocalizedDescription = (store, lang) => {
            const fieldMap = {
                en: 'description_eng',
                zh: 'description_cn',
                ja: 'description_jp'
            };
            return store[fieldMap[lang]] || store.description || store.keyword || '';
        };

        const getLocalizedSummary = (store, lang) => {
            const fieldMap = {
                en: 'summary_eng',
                zh: 'summary_cn',
                ja: 'summary_jp'
            };
            return store[fieldMap[lang]] || store.summary || '';
        };

        const getSheetRecommendationReason = (store, selection, lang) => {
            const langFieldMap = {
                en: 'recommendReason_eng',
                zh: 'recommendReason_cn',
                ja: 'recommendReason_jp'
            };
            const preferenceFieldMap = [
                { matches: ['핫플', 'Hot Place', '热门打卡'], field: 'recommendHot' },
                { matches: ['첫 방문', 'First Visit', '首次访问'], field: 'recommendFirst' },
                { matches: ['숨은 맛집', 'Hidden Gem', '隐秘美食'], field: 'recommendHidden' },
                { matches: ['빠른 동선', 'Efficient', '高效路线'], field: 'recommendFast' }
            ];
            const preferenceMatch = preferenceFieldMap.find(item => item.matches.includes(selection.preference));
            return (preferenceMatch && store[preferenceMatch.field])
                || store[langFieldMap[lang]]
                || store.recommendReason
                || '';
        };

        const getInterestProfiles = (selection) => {
            const selected = selection.interests || [];
            const has = (labels) => selected.some(item => labels.includes(item));
            const profiles = [];

            if (has(['식사', 'Meal', '正餐', '食事'])) {
                profiles.push({
                    category: ['식당'],
                    terms: ['식당', '밥', '식사', '국수', '분식', '떡볶이', '김밥', '만두', '한식', 'meal', 'restaurant', 'noodle', 'tteokbokki']
                });
            }
            if (has(['간식 • 디저트', 'Snack/Dessert', '零食 • 甜点', 'おやつ • デザート'])) {
                profiles.push({
                    category: ['간식'],
                    terms: ['간식', '디저트', '꽈배기', '도너츠', '떡', '빵', '카페', '커피', 'snack', 'dessert', 'doughnut', 'coffee']
                });
            }
            if (has(['전통 먹거리', 'Traditional Food', '传统小吃', '伝統グルメ'])) {
                profiles.push({
                    category: ['간식', '식당'],
                    terms: ['전통', '시장간식', '기름떡볶이', '떡', '엽전', 'traditional', 'market', 'tteok']
                });
            }
            if (has(['구경 • 소품', 'Sightseeing/Goods', '参观 • 纪念品', '見学 • 小物'])) {
                profiles.push({
                    category: ['문화', '잡화', '생활형 점포'],
                    terms: ['구경', '소품', '선물', '기념', '공방', '갤러리', '꽃', '문화', '생활', 'goods', 'gift', 'souvenir', 'craft']
                });
            }

            return profiles;
        };

        const createRecommendationReason = (store, selection, lang) => {
            const summary = getLocalizedSummary(store, lang);
            if (summary) return summary;

            const sheetReason = getSheetRecommendationReason(store, selection, lang);
            if (sheetReason) return sheetReason;

            const base = getLocalizedDescription(store, lang);
            const interest = (selection.interests || []).join(', ');
            const preference = selection.preference || '';
            const messages = {
                ko: `${base} 선택하신 관심사(${interest})와 '${preference}' 방식에 잘 맞는 점포예요.`,
                en: `${base} This spot fits your interests (${interest}) and your "${preference}" recommendation style.`,
                zh: `${base} 这家店很适合您选择的兴趣（${interest}）和「${preference}」推荐方式。`,
                ja: `${base} 選択した関心事（${interest}）と「${preference}」のおすすめスタイルに合うお店です。`
            };
            return messages[lang] || messages.ko;
        };

        const getFastRecommendations = (selection, storeList, lang) => {
            const stores = (storeList || []).filter(store => store.name);
            if (!stores.length) return [];

            const profiles = getInterestProfiles(selection);
            const preferenceText = normalizeText(selection.preference);
            const selectedText = normalizeText([
                selection.purpose,
                selection.companion,
                ...(selection.interests || []),
                selection.preference
            ].join(' '));

            const scored = stores.map((store, index) => {
                const searchable = normalizeText([
                    store.name,
                    store.category,
                    store.description,
                    store.description_eng,
                    store.description_cn,
                    store.description_jp,
                    store.keyword
                ].join(' '));

                let score = 0;

                profiles.forEach(profile => {
                    if (profile.category.some(category => store.category === category)) score += 35;
                    profile.terms.forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 12;
                    });
                });

                if (store.coin && normalizeText(store.coin) === 'o') score += 10;
                if (selectedText.includes('먹거리') || selectedText.includes('food')) {
                    if (['간식', '식당'].includes(store.category)) score += 12;
                }

                if (preferenceText.includes('핫플') || preferenceText.includes('hot') || preferenceText.includes('热门')) {
                    if (store.coin && normalizeText(store.coin) === 'o') score += 14;
                    ['기름떡볶이', '꽈배기', '시장간식', '전통'].forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 10;
                    });
                }

                if (preferenceText.includes('첫방문') || preferenceText.includes('first') || preferenceText.includes('首次')) {
                    if (['간식', '식당'].includes(store.category)) score += 10;
                    if (store.coin && normalizeText(store.coin) === 'o') score += 8;
                }

                if (preferenceText.includes('숨은') || preferenceText.includes('hidden') || preferenceText.includes('隐秘')) {
                    ['수제', '전문', '공방', '직접', '특제', 'specialty', 'craft'].forEach(term => {
                        if (searchable.includes(normalizeText(term))) score += 10;
                    });
                }

                if (preferenceText.includes('빠른') || preferenceText.includes('efficient') || preferenceText.includes('高效')) {
                    score += Math.max(0, 18 - index * 0.2);
                }

                return { store, index, score };
            });

            const top = scored
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score || a.index - b.index)
                .slice(0, 4);

            const fallback = scored
                .filter(item => !top.some(topItem => topItem.store.name === item.store.name))
                .filter(item => ['간식', '식당', '문화', '잡화'].includes(item.store.category) || item.store.coin)
                .sort((a, b) => a.index - b.index)
                .slice(0, Math.max(0, 4 - top.length));

            return [...top, ...fallback].slice(0, 4).map(({ store }, index) => ({
                id: `fast-${Date.now()}-${index}`,
                name: store.name,
                description: createRecommendationReason(store, selection, lang),
                slug: store.slug || null,
                checked: false
            }));
        };

        const getRecommendations = async (selection, storeList, lang) => {
            const fastRecommendations = getFastRecommendations(selection, storeList, lang);
            if (fastRecommendations.length) {
                return { data: fastRecommendations, error: "" };
            }

            return {
                data: [],
                error: "\uC810\uD3EC \uB370\uC774\uD130\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4. \uC7A0\uC2DC \uD6C4 \uB2E4\uC2DC \uC2DC\uB3C4\uD574\uC8FC\uC138\uC694."
            };
        };

        // --- Components ---

        const Layout = ({ children, step, totalSteps, title, showProgress = true, lang, setLang, onBack, showBackButton = false }) => {

            const changeLang = (l) => {

            const langLabels = { ko: '한국어', en: 'English', zh: '中文', ja: '日本語' };

            return (
                <div className="min-h-[100dvh] bg-[#F1F5F9] flex justify-center">
                    <div className="w-full max-w-md bg-[#FAFAFA] min-h-[100dvh] shadow-xl flex flex-col relative pb-[60px]">
                        <header className="px-6 pt-[max(1.5rem,env(safe-area-inset-top))] pb-6 flex justify-between items-center bg-white border-b border-gray-100 z-50 sticky top-0">
                            <div className="flex items-center gap-3">
                                {showBackButton && onBack && (

                                        aria-label="이전 단계"
                                    >
                                        <svg className="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
                                        </svg>
                                    </button>
                                )}
                                {step === 0 ? (
                                    <div className="flex items-center gap-2">
                                        <img src="assets/mjlogo.png" alt="만장일치 로고" className="w-[1.2rem] mt-0.5 h-auto object-contain" />
                                        <span className="text-[21px] text-gray-900 leading-none outline-none mt-1" style={{ fontFamily: 'Jandari', fontWeight: 'normal' }}>{title || '만장일치'}</span>
                                    </div>
                                ) : (
                                    <div className="text-gray-500 text-sm font-black uppercase tracking-widest">
                                        {showProgress && step > 0 && step <= totalSteps ? `Step ${step} / ${totalSteps}` : ''}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center gap-1.5 relative">
                                {/* Globe Language Selector */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setIsLangMenuOpen(!isLangMenuOpen)} 
                                        className="p-1.5 rounded-full hover:bg-gray-100 transition-all active:scale-95 text-[#A68A64]"
                                        aria-label="언어 변경"
                                    >
                                        <Globe className="w-5.5 h-5.5 text-[#A68A64]" />
                                    </button>

                                    {isLangMenuOpen && (
                                        <div className="absolute right-0 top-full mt-2 w-32 bg-white rounded-2xl shadow-xl border border-gray-200/80 overflow-hidden z-[130] animate-in fade-in zoom-in-95 duration-150">
                                            {Object.entries(langLabels).map(([key, label]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => changeLang(key)}
                                                    className={`w-full text-left px-4 py-3 text-xs font-bold transition-colors ${lang === key ? 'text-[#A68A64] bg-[#FDFBF7]' : 'text-gray-600 hover:bg-gray-50'}`}
                                                >
                                                    {label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                            </div>
                        </header>

                        {showProgress && step > 0 && step <= totalSteps && (
                            <div className="px-6 pb-6">
                                <div className="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
                                    <div
                                        className={`h-full bg-[#A68A64] transition-all duration-300 ease-out`}
                                        style={{ width: `${progressPercentage}%` }}
                                    ></div>
                                </div>
                            </div>
                        )}

                        <main className="flex-1 px-6 pb-32 overflow-y-auto no-scrollbar">
                            {children}
                        </main>
                    </div>
                </div>
            );
        };

        const SelectionButton = ({ selected, onClick, children, className = "" }) => {
            return (
                <button
                    onClick={onClick}
                    className={`
              w-full aspect-square flex flex-col items-center justify-center rounded-2xl border transition-all duration-200
              ${selected
                            ? 'border-[#A68A64] bg-[#FDFBF7] text-[#A68A64] ring-1 ring-[#A68A64]'
                            : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'
                        }
              ${className}
            `}
                >
                    {children}
                </button>
            );
        };

        const NextButton = ({ onClick, disabled = false, label = "다음", variant = 'secondary' }) => {
            const baseClasses = "w-full py-4 rounded-xl font-medium text-lg transition-colors";
            const variants = {
                primary: "bg-[#A68A64] text-white hover:bg-[#8D7350]",
                secondary: "bg-[#E6E0D4] text-gray-700 hover:bg-[#D9D1C1] disabled:opacity-50 disabled:cursor-not-allowed"
            };

            return (
                <div className="fixed bottom-0 w-full max-w-md bg-white px-6 pt-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] border-t border-gray-50 left-0 right-0 mx-auto z-20">
                    <button
                        onClick={onClick}
                        disabled={disabled}
                        className={`${baseClasses} ${variants[variant]}`}
                    >
                        {label}
                    </button>
                </div>
            );
        };

        const LandingCarousel = () => {
            const images = ['assets/slide1.jpg', 'assets/slide2.jpg', 'assets/slide3.jpg', 'assets/slide4.jpg'];
            const extendedImages = [images[images.length - 1], ...images, images[0]];
            const scrollContainerRef = React.useRef(null);

            useEffect(() => {
                const container = scrollContainerRef.current;
                if (!container) return;

                const initScroll = () => {
                    if (container.clientWidth > 0) {
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = container.clientWidth;
                        container.style.scrollBehavior = "smooth";
                    }
                };
                
                requestAnimationFrame(initScroll);

                let isFixing = false;
                const handleScroll = () => {
                    if (isFixing) return;
                    const width = container.clientWidth;
                    const scrollLeft = container.scrollLeft;
                    
                    if (width === 0) return;
                    
                    const maxScroll = width * (extendedImages.length - 1);
                    
                    if (scrollLeft <= 5) {
                        isFixing = true;
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = width * images.length;
                        requestAnimationFrame(() => {
                            container.style.scrollBehavior = "smooth";
                            isFixing = false; 
                        });
                    } else if (scrollLeft >= maxScroll - 5) {
                        isFixing = true;
                        container.style.scrollBehavior = 'auto';
                        container.scrollLeft = width;
                        requestAnimationFrame(() => {
                            container.style.scrollBehavior = "smooth";
                            isFixing = false; 
                        });
                    }
                };

                container.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('resize', initScroll);
                return () => {
                    container.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', initScroll);
                };
            }, []);

            return (
                <div className="w-full relative bg-gray-100 overflow-hidden border-y border-gray-200/80">
                    <div
                        ref={scrollContainerRef}
                        className="flex w-full overflow-x-auto snap-x snap-mandatory no-scrollbar"

                                    alt={`Slide ${idx}`}

                                {/* 하단 진한 그라데이션 오버레이 */}
                                <div className="absolute inset-x-0 bottom-0 h-44 bg-gradient-to-t from-black/90 via-black/60 to-transparent pointer-events-none z-10" />

                                {/* 이미지 하단 텍스트 (더 크고 또렷하게, 검색창과 안겹치게 bottom-14 지정) */}
                                <div className="absolute left-6 bottom-14 z-20 text-white pointer-events-none">
                                    <h2 className="text-3xl sm:text-4xl font-black tracking-tight drop-shadow-lg leading-tight">
                                        통인시장
                                    </h2>
                                    <p className="text-sm sm:text-base font-semibold text-white/95 mt-1.5 drop-shadow-md">
                                        예술과 문화가 공존하는 전통시장
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

        };

        // --- Components ---
        const GuideModal = ({ isOpen, onClose, lang, setLang }) => {

            const [isMenuOpen, setIsMenuOpen] = useState(false);

            if (!isOpen) return null;

            const toggleMenu = () => setIsMenuOpen(!isMenuOpen);

            const data = currentLangData.steps;

            const currentData = data[step - 1];

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/40 backdrop-blur-sm transition-opacity">
                    <div className="w-full max-w-[310px] bg-[#FFFdf9] rounded-[24px] overflow-visible shadow-2xl relative flex flex-col transition-all">
                        <div className="px-5 pt-4 pb-3">
                            <div className="flex justify-between items-start mb-1">
                                <div>
                                    <p className="text-[10px] text-[#A68A64] font-medium mb-1 tracking-wide">{currentLangData.guideTitle}</p>
                                    <h2 className="text-[15px] font-bold text-gray-900 leading-tight">{currentLangData.modalTitle}</h2>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="relative">
                                        <button onClick={toggleMenu} className="p-1 rounded-full hover:bg-gray-100 transition-colors mt-0.5">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-globe text-[#A68A64] w-5 h-5"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
                                        </button>
                                        {isMenuOpen && (
                                            <div className="absolute right-0 top-full mt-2 w-28 bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden z-50">
                                                {Object.entries(langLabels).map(([key, label]) => (
                                                    <button
                                                        key={key}
                                                        onClick={() => changeLang(key)}
                                                        className={`w-full text-left px-4 py-2.5 text-sm font-medium hover:bg-gray-50 transition-colors ${lang === key ? 'text-[#A68A64] bg-[#FDFBF7]' : 'text-gray-600'}`}
                                                    >
                                                        {label}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={onClose} className="w-[26px] h-[26px] flex items-center justify-center rounded-full bg-[#EAE5D9] text-[#7A6A58] hover:bg-[#E0DBCF] transition-colors active:scale-95 shadow-sm mt-0.5">
                                        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="w-full aspect-[3/2] bg-[#F4EBE0] relative flex items-center justify-center overflow-hidden z-0">
                            <img src={`assets/coin_slide${step}.png`} alt={`${currentLangData.guideTitle} ${step}`} className="w-full h-full object-cover" />
                        </div>

                        <div className="px-5 pt-4 pb-4 flex-1 flex flex-col bg-[#FFFdf9] rounded-b-[24px] z-10">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-[22px] h-[22px] rounded-full bg-[#A88761] text-white flex items-center justify-center text-[10px] font-bold font-sans">
                                    {step}
                                </div>
                                <span className="text-[#BCA186] text-[11px] font-bold tracking-wide">{currentLangData.stepPrefix} {step} / 4</span>
                            </div>

                            <h3 className="text-[18px] font-extrabold text-gray-900 mb-1.5 leading-none tracking-tight">{currentData.title}</h3>
                            <p className="text-[13px] text-[#555] mb-2.5 break-keep leading-snug">{currentData.desc}</p>

                            <div className="bg-[#f0eadd] rounded-[12px] p-3 mb-2.5 shadow-[inset_0_1px_3px_rgba(0,0,0,0.02)]">

                                    {currentData.box}

                                {currentData.note}

                            <div className="flex items-center justify-between mt-auto pt-1">
                                <div className="flex gap-1.5 items-center">
                                    {[1,2,3,4].map(idx => (

                                <div className="flex gap-2">

                        if (m.coins === currentRem && !bentoItems.some(i => i.storeName === store.name)) {
                            candidates.push({ store, menu: m });
                            break;
                        }
                    }
                    if (candidates.length > 0) break;
                }

                        for (const m1 of s1.menus) {
                            for (const s2 of storeList) {
                                if (s1.id === s2.id) continue;
                                for (const m2 of s2.menus) {

                        storeName: store.name,

                                    <div className="space-y-2">
                                        {selectedParking.cautions.map((c, idx) => (
                                            <div key={idx} className={`p-3 rounded-2xl text-xs font-bold space-y-1 ${c.type === 'warning' ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-blue-50 text-blue-900 border border-blue-100'}`}>
                                                <div className="flex items-center gap-1.5">
                                                    <span>{c.type === 'warning' ? '⚠️' : 'ℹ️'}</span>
                                                    <span>{c.text}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-3 pt-2">
                                <a 
                                    href={`tel:${selectedParking.phone}`}
                                    className="flex-1 py-3.5 bg-gray-100 text-gray-800 font-bold text-xs rounded-2xl flex items-center justify-center gap-1 active:scale-95 transition-all hover:bg-gray-200"
                                >
                                    📞 전화 문의
                                </a>
                                <a 
                                    href={selectedParking.mapUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex-2 py-3.5 bg-[#A68A64] text-white font-bold text-xs rounded-2xl flex items-center justify-center gap-1 shadow-md active:scale-95 transition-all hover:bg-[#937754]"
                                >
                                    🚗 길찾기 시작
                                </a>
                            </div>
                        </div>
                    </div>
                );
            };

            const RenderToiletMapModal = () => {
                if (!selectedToilet) return null;

                return (
                    <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                        <div className="w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl max-h-[85vh] overflow-y-auto p-6 space-y-5">
                            <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                                <button 
                                    onClick={() => setSelectedToilet(null)}
                                    className="text-sm font-bold text-gray-500 hover:text-gray-900 flex items-center gap-1"
                                >
                                    ← 화장실 위치
                                </button>
                                <button 
                                    onClick={() => setSelectedToilet(null)}
                                    className="w-8 h-8 rounded-full bg-gray-100 text-gray-500 font-bold text-base flex items-center justify-center"
                                >×</button>
                            </div>

                            <div className="bg-[#FAF8F5] rounded-2xl p-4 border border-[#EFE8DC] space-y-2">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <span className="text-xs font-bold text-gray-400">{selectedToilet.location}</span>
                                        <h4 className="text-lg font-bold text-gray-900">{selectedToilet.name}</h4>
                                    </div>
                                    <span className="text-xl font-black text-[#A68A64]">{selectedToilet.walkTime} <span className="text-xs text-gray-500 font-bold">도보</span></span>
                                </div>

                                <div className="flex flex-wrap gap-1.5 pt-1">
                                    {selectedToilet.tags.map((t, idx) => (
                                        <span key={idx} className="bg-white text-gray-700 border border-gray-200 text-[10px] font-bold px-2 py-0.5 rounded-md">
                                            {t}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div className="h-44 bg-gray-100 rounded-2xl overflow-hidden relative border border-gray-200 flex flex-col items-center justify-center text-center p-4">
                                <div className="absolute inset-0 bg-cover bg-center opacity-40" style={{ backgroundImage: `url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=400&q=80')` }}></div>
                                <div className="relative z-10 space-y-1">
                                    <span className="text-2xl block">📍</span>
                                    <p className="text-xs font-bold text-gray-900">내 위치에서 도보 1분</p>
                                    <p className="text-[10px] text-gray-500">통인시장 고객센터 1층 중앙 입구</p>
                                </div>
                            </div>

                            <a 
                                href="map.html?filter=toilet"
                                className="w-full py-4 bg-[#A68A64] text-white font-bold text-sm rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-1"
                            >
                                🗺️ 길찾기 시작
                            </a>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-50 flex justify-center font-sans">
                    <div className="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col relative pb-[60px]">
                        <TopNavHeader />

                        <main className="flex-1 overflow-y-auto no-scrollbar">
                            {view === 'INPUT' && <RenderInputView />}
                            {view === 'LIST' && <RenderListView />}
                            {view === 'COMPLETE' && <RenderCompleteView />}
                            {view === 'FACILITIES' && <RenderFacilitiesView />}
                        </main>

                        {activeModal === 'STORE_DETAIL' && <StoreDetailModal />}
                        {activeModal === 'PURCHASE_INFO' && <PurchaseInfoModal />}
                        {selectedParking && <RenderParkingDetailModal />}
                        {selectedToilet && <RenderToiletMapModal />}

                        {/* Global Navigation Bar */}
                        <nav className="fixed bottom-0 left-0 right-0 z-[60] flex justify-center pointer-events-none transition-transform duration-300">
                            <div className="w-full max-w-md bg-white border-t border-gray-100 flex justify-around items-center pb-[max(0.25rem,env(safe-area-inset-bottom))] pt-1.5 px-2 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] pointer-events-auto">
                                <button onClick={() => window.location.href='index.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
                                    <span className="text-[9px] font-bold">홈</span>
                                </button>
                                <button onClick={() => window.location.href='stores.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <Store className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">매장</span>
                                </button>
                                <button onClick={() => window.location.href='map.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                    <MapPin className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">지도</span>
                                </button>
                                <button 
                                    onClick={() => setView('INPUT')} 
                                    className={`flex flex-col items-center gap-0.5 p-1.5 transition-colors ${view !== 'FACILITIES' ? 'text-gray-900 font-bold' : 'text-gray-400 hover:text-gray-900'}`}
                                >
                                    <Coins className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">엽전도시락</span>
                                </button>
                                <button 
                                    onClick={() => setView('FACILITIES')} 
                                    className={`flex flex-col items-center gap-0.5 p-1.5 transition-colors ${view === 'FACILITIES' ? 'text-gray-900 font-bold' : 'text-gray-400 hover:text-gray-900'}`}
                                >
                                    <Users className="w-5 h-5" />
                                    <span className="text-[9px] font-bold">편의시설</span>
                                </button>
                            </div>
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
