<body class="bg-gray-100 text-gray-900 antialiased selection:bg-orange-100 selection:text-orange-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        import {
            Search, MapPin, Sparkles, Coins, Users, Utensils,
            ChevronRight, Globe, Menu, Store, ArrowLeft, X
        } from 'lucide-react';

        // --- Store List Fetcher ---
        const fetchStoreList = async () => {
            try {
                const csvRes = await fetch('stores.csv');
                if (!csvRes.ok) throw new Error('CSV load failed');
                const text = await csvRes.text();
                const lines = text.trim().split(/\r?\n/);
                if (lines.length < 2) return [];

                const splitCsvLine = (line) => {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') {
                            if (inQuotes && line[i + 1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    result.push(current.trim());
                    return result;
                };

                const headers = splitCsvLine(lines[0]);
                const stores = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const row = splitCsvLine(lines[i]);
                    if (row.length < headers.length) continue;

                    const getVal = (r, keys) => {
                        for (const key of keys) {
                            const idx = headers.indexOf(key);
                            if (idx !== -1 && r[idx]) return r[idx];
                        }
                        return '';
                    };

                    const rawCat = getVal(row, ['category', '카테고리']);
                    let cat = "생활형";
                    if (/식당/.test(rawCat)) cat = "식당";
                    else if (/(간식|디저트|카페)/.test(rawCat)) cat = "간식";

                    stores.push({
                        id: i,
                        name: getVal(row, ['name', '점포명']),
                        description: getVal(row, ['description', 'shortDesc', '설명']),
                        category: cat,
                        repre_img: getVal(row, ['repre_img', 'repre_image', '이미지']),
                        keywords: getVal(row, ['keywords', '키워드'])
                    });
                }
                return stores;
            } catch (e) {
                console.error('Fetch stores failed:', e);
                return [];
            }
        };

        const StoreDetailModal = ({ store, onClose }) => {
            if (!store) return null;
            const [activeTab, setActiveTab] = useState('home');
            const [isFav, setIsFav] = useState(false);

            const rawImg = store.repre_img || store.repre_image || '';
            let imgUrl = rawImg;
            if (rawImg.includes('drive.google.com')) {
                const match = rawImg.match(/\/d\/([^/]+)/);
                if (match && match[1]) {
                    imgUrl = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
                }
            }

            const rawDesc = store.description || '';
            // Check if description is a real sentence (>20 chars) vs just menu keywords
            const isRealDesc = rawDesc && rawDesc.length > 20 && rawDesc !== store.category && !(/^[가-힣a-zA-Z0-9\s,·]+$/.test(rawDesc) && rawDesc.length < 25);
            const descText = isRealDesc
                ? rawDesc
                : rawDesc && rawDesc.length > 1 && rawDesc !== store.category
                    ? `${store.name}은(는) ${rawDesc} 등을 제공하는 통인시장의 인기 ${store.category} 상점입니다. 정성과 인심을 담아 고객을 맞이합니다.`
                    : `${store.name}은(는) 통인시장의 정성과 인심을 담아 고객을 맞이하는 대표 ${store.category} 상점입니다. 신선한 재료와 정성스러운 서비스를 제공합니다.`;

            const subText = rawDesc && rawDesc.length > 1 && rawDesc !== store.category
                ? rawDesc
                : `통인시장 대표 ${store.category} 상점`;

            const keywordList = (store.keywords || store.description || '')
                .split(/[,|\s]+/)
                .filter(k => k && k.length >= 2 && k !== store.category);
            
            const displayKeywords = keywordList.length > 0 ? keywordList.slice(0, 5) : [store.category, '통인시장', '추천점포', '엽전가맹점'];

            const catTagColor = store.category === '식당' 
                ? 'bg-[#F4AFA0] text-[#1A1A1B]' 
                : store.category === '간식' 
                ? 'bg-[#F6D267] text-[#1A1A1B]' 
                : 'bg-[#A8D8C9] text-[#1A1A1B]';

            const handleShare = () => {
                if (navigator.share) {
                    navigator.share({
                        title: store.name,
                        text: `${store.name} - 통인시장`,
                        url: window.location.href
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert('점포 링크가 복사되었습니다!');
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs transition-opacity animate-in fade-in duration-200" onClick={onClose}>
                    <div className="bg-white w-full max-w-md max-h-[85vh] max-h-[85dvh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-100 animate-in zoom-in-95 duration-200" onClick={(e) => e.stopPropagation()}>
                        {/* Top Summary Header */}
                        <div className="px-6 pt-4 pb-3.5 bg-white border-b border-gray-100 shrink-0">
                            <div className="flex justify-between items-center mb-2">
                                <div className="flex items-center gap-1.5">
                                    <span className={`${catTagColor} px-2.5 py-0.5 rounded text-[11px] font-bold`}>
                                        {store.category}
                                    </span>
                                    <span className="inline-flex items-center gap-1 bg-[#FFFBEB] border border-[#FDE68A] text-[#D97706] px-2 py-0.5 rounded text-[11px] font-bold">
                                        <span>🪙 엽전 가맹점</span>
                                    </span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button 
                                        onClick={handleShare}
                                        className="w-8 h-8 rounded-full border border-gray-200 text-gray-500 bg-white hover:bg-gray-50 active:scale-95 flex items-center justify-center transition-all"
                                        title="공유하기"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                                    </button>
                                    <button 
                                        onClick={() => setIsFav(!isFav)}
                                        className={`w-8 h-8 rounded-full border flex items-center justify-center transition-all active:scale-95 ${isFav ? 'bg-pink-50 border-pink-200 text-pink-500' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-50'}`}
                                        title="즐겨찾기"
                                    >
                                        <svg className="w-4 h-4" fill={isFav ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                                    </button>
                                    <button 
                                        onClick={onClose}
                                        className="w-8 h-8 rounded-full bg-gray-100 text-gray-500 font-bold text-sm flex items-center justify-center hover:bg-gray-200 active:scale-95 transition-all"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </div>
                            <div>
                                <h2 className="text-[22px] text-gray-900 leading-tight font-extrabold" style={{ fontFamily: 'Jandari, Pretendard, sans-serif' }}>{store.name}</h2>
                                <p className="text-xs text-gray-500 mt-0.5 truncate">{subText}</p>
                            </div>
                        </div>

                        {/* Scrollable Content Body - min-h-0 is mandatory for flex-1 scrolling */}
                        <div className="overflow-y-auto flex-1 min-h-0 no-scrollbar bg-white">
                            {/* Image Banner */}
                            <div className="relative w-full h-44 sm:h-48 bg-gray-100 shrink-0 overflow-hidden">
                                {imgUrl ? (
                                    <img 
                                        src={imgUrl} 
                                        alt={store.name} 
                                        className="w-full h-full object-cover"
                                        onError={(e) => {
                                            e.target.style.display = 'none';
                                            if (e.target.nextElementSibling) e.target.nextElementSibling.style.display = 'flex';
                                        }}
                                    />
                                ) : null}
                                <div className={`w-full h-full flex items-center justify-center ${imgUrl ? 'hidden' : ''}`}>
                                    <span className="text-5xl">{store.category === '식당' ? '🍲' : store.category === '간식' ? '🥨' : '🏪'}</span>
                                </div>
                                <div className="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
                            </div>

                            {/* Tabs Navigation */}
                            <div className="sticky top-0 z-30 bg-white border-b border-gray-100 flex justify-between px-6 text-xs font-bold text-gray-500">
                                <button onClick={() => setActiveTab('home')} className={`flex-1 py-3 text-center transition-colors ${activeTab === 'home' ? 'text-gray-900 border-b-2 border-gray-900 font-extrabold' : 'hover:text-gray-700'}`}>홈</button>
                                <button onClick={() => setActiveTab('menu')} className={`flex-1 py-3 text-center transition-colors ${activeTab === 'menu' ? 'text-gray-900 border-b-2 border-gray-900 font-extrabold' : 'hover:text-gray-700'}`}>메뉴</button>
                                <button onClick={() => setActiveTab('info')} className={`flex-1 py-3 text-center transition-colors ${activeTab === 'info' ? 'text-gray-900 border-b-2 border-gray-900 font-extrabold' : 'hover:text-gray-700'}`}>정보</button>
                            </div>

                            {/* Tab Body Content */}
                            <div className="p-5 space-y-4">
                                {activeTab === 'home' && (
                                    <>
                                        <div className="space-y-1.5 bg-[#FAF8F5] p-4 rounded-2xl border border-[#EFE8DC]">
                                            <h4 className="text-xs font-extrabold text-[#8B6B4A]">상점 소개</h4>
                                            <p className="text-xs text-gray-700 leading-relaxed font-medium">
                                                {descText}
                                            </p>
                                        </div>

                                        <div className="space-y-1.5">
                                            <h4 className="text-xs font-bold text-gray-400">대표 키워드</h4>
                                            <div className="flex flex-wrap gap-1.5">
                                                {displayKeywords.map((tag, idx) => (
                                                    <span key={idx} className="bg-gray-100 text-gray-600 text-[11px] font-bold px-2.5 py-1 rounded-lg">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {activeTab === 'menu' && (
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-gray-700">대표 메뉴 목록</h4>
                                        <div className="p-3 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-between">
                                            <div>
                                                <div className="text-xs font-bold text-gray-900">대표 추천 메뉴 1</div>
                                                <div className="text-[11px] text-gray-500">통인시장 정통 손맛</div>
                                            </div>
                                            <span className="text-xs font-bold text-[#D97706]">5,000원</span>
                                        </div>
                                        <div className="p-3 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-between">
                                            <div>
                                                <div className="text-xs font-bold text-gray-900">인기 대표 메뉴 2</div>
                                                <div className="text-[11px] text-gray-500">인기 시그니처 아이템</div>
                                            </div>
                                            <span className="text-xs font-bold text-[#D97706]">3,000원</span>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'info' && (
                                    <div className="space-y-2 text-xs text-gray-700 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                        <p><strong className="text-gray-900">주소:</strong> 서울특별시 종로구 자하문로15길 18 (통인시장)</p>
                                        <p><strong className="text-gray-900">영업시간:</strong> 11:00 - 17:00 (월요일 휴무)</p>
                                        <p><strong className="text-gray-900">결제안내:</strong> 엽전, 카드, 현금 가능</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Bottom Action Buttons Bar - Always pinned and visible */}
                        <div className="p-3.5 bg-white border-t border-gray-100 flex gap-2.5 shrink-0 z-50">
                            <button 
                                onClick={() => window.location.href = `map.html?open=${encodeURIComponent(store.name)}`}
                                className="flex-1 h-11 bg-[#0F172A] hover:bg-[#1e293b] text-white font-bold text-[14px] rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-sm"
                            >
                                <MapPin className="w-4 h-4 text-white" />
                                <span>지도에서 길찾기</span>
                            </button>
                            <button 
                                onClick={() => window.location.href = 'markets.html'}
                                className="px-4 h-11 bg-[#FAF5ED] hover:bg-[#F5EFE4] text-[#8B6B4A] border border-[#E8DEC9] font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 active:scale-[0.98] transition-all shrink-0"
                            >
                                <Coins className="w-4 h-4" />
                                <span>엽전도시락</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StoresApp = () => {
            const [storeList, setStoreList] = useState([]);
            const [selectedStore, setSelectedStore] = useState(null);
            const [category, setCategory] = useState('전체');
            const [search, setSearch] = useState('');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isLangMenuOpen, setIsLangMenuOpen] = useState(false);
            const [lang, setLang] = useState(localStorage.getItem('tongin_lang') || 'ko');

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const catParam = urlParams.get('category');
                const searchParam = urlParams.get('search');
                if (catParam) setCategory(catParam);
                if (searchParam) setSearch(searchParam);

                fetchStoreList().then(list => setStoreList(list));
            }, []);

            const categories = ['전체', '식당', '간식', '생활형'];
            const filtered = storeList.filter(store => {
                const matchCat = category === '전체' || store.category === category;
                const matchSearch = !search.trim() ||
                    store.name.toLowerCase().includes(search.toLowerCase()) ||
                    (store.description && store.description.toLowerCase().includes(search.toLowerCase())) ||
                    (store.keywords && store.keywords.toLowerCase().includes(search.toLowerCase()));
                return matchCat && matchSearch;
            });

            return (
                <div className="min-h-[100dvh] bg-[#F1F5F9] flex justify-center">
                    <div className="w-full max-w-md bg-white min-h-[100dvh] shadow-xl flex flex-col relative font-sans">
                    {/* Header */}
                    <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-100 px-6 py-3.5 flex items-center justify-between">
                        <a href="index.html" className="flex items-center gap-2 group">
                            <img src="assets/mjlogo.png" alt="만장일치 로고" className="w-6 h-auto object-contain transition-transform group-hover:scale-105" />
                            <span className="font-extrabold text-gray-900 text-lg tracking-tight" style={{ fontFamily: 'Jandari' }}>만장일치</span>
                        </a>

                        <div className="flex items-center gap-1.5 relative">
                            {/* Globe Language Selector */}
                            <div className="relative">
                                <button
                                    onClick={() => setIsLangMenuOpen(!isLangMenuOpen)}
                                    className="p-1.5 rounded-full hover:bg-gray-100 transition-all active:scale-95 text-[#A68A64]"
                                    aria-label="언어 변경"
                                >
                                    <Globe className="w-5 h-5" />
                                </button>
                                {isLangMenuOpen && (
                                    <div className="absolute right-0 top-full mt-2 w-32 bg-white rounded-2xl shadow-xl border border-gray-100 py-1.5 z-50 animate-in fade-in zoom-in-95 duration-150">
                                        <button
                                            onClick={() => { setLang('ko'); localStorage.setItem('tongin_lang', 'ko'); setIsLangMenuOpen(false); }}
                                            className={`w-full px-4 py-2 text-xs font-bold text-left flex items-center justify-between ${lang === 'ko' ? 'text-[#A68A64] bg-[#FAF8F5]' : 'text-gray-700 hover:bg-gray-50'}`}
                                        >
                                            한국어 {lang === 'ko' && '✓'}
                                        </button>
                                        <button
                                            onClick={() => { setLang('en'); localStorage.setItem('tongin_lang', 'en'); setIsLangMenuOpen(false); }}
                                            className={`w-full px-4 py-2 text-xs font-bold text-left flex items-center justify-between ${lang === 'en' ? 'text-[#A68A64] bg-[#FAF8F5]' : 'text-gray-700 hover:bg-gray-50'}`}
                                        >
                                            English {lang === 'en' && '✓'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Page Content */}
                    <div className="flex-1 px-6 py-6 space-y-6">
                        {/* Page Title Header */}
                        <div className="text-center space-y-1">
                            <h1 className="text-xl font-extrabold text-gray-900 tracking-tight">통인시장 매장</h1>
                            <p className="text-xs text-gray-500 font-medium">통인시장의 모든 점포를 한눈에 둘러보세요 ({filtered.length}개)</p>
                            <div className="w-6 h-0.5 bg-[#A68A64]/40 mx-auto mt-2"></div>
                        </div>

                        {/* Search & Category Filters */}
                        <div className="space-y-3">
                            {/* Search Input */}
                            <div className="relative">
                                <input
                                    type="text"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    placeholder="점포명 또는 메뉴 검색 (예: 떡볶이, 기름떡볶이)"
                                    className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 pl-10 pr-9 text-xs font-semibold text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#A68A64] focus:bg-white transition-all shadow-xs"
                                />
                                <Search className="w-4 h-4 text-[#A68A64] absolute left-3.5 top-3.5" />
                                {search && (
                                    <button
                                        onClick={() => setSearch('')}
                                        className="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                                    >
                                        <X className="w-4 h-4" />
                                    </button>
                                )}
                            </div>

                            {/* Category Filter Chips */}
                            <div className="flex gap-2 overflow-x-auto no-scrollbar pt-1 pb-1">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setCategory(cat)}
                                        className={`shrink-0 px-4 py-2 rounded-full text-xs font-bold transition-all ${category === cat ? 'bg-[#A68A64] text-white shadow-xs' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        {cat} {cat === '전체' ? `(${storeList.length})` : ''}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2x2 Store Grid Layout */}
                        {filtered.length > 0 ? (
                            <div className="grid grid-cols-2 gap-3.5 pt-1 pb-4">
                                {filtered.map(store => {
                                    const rawImg = store.repre_img || store.repre_image || '';
                                    let imgUrl = rawImg;
                                    if (rawImg.includes('drive.google.com')) {
                                        const match = rawImg.match(/\/d\/([^/]+)/);
                                        if (match && match[1]) {
                                            imgUrl = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
                                        }
                                    }
                                    return (
                                        <div
                                            key={store.id}
                                            onClick={() => setSelectedStore(store)}
                                            className="bg-white rounded-2xl border border-gray-200/90 overflow-hidden cursor-pointer hover:border-[#A68A64] active:scale-[0.98] transition-all shadow-2xs group flex flex-col justify-between"
                                        >
                                            <div className="h-[125px] bg-gray-100 flex items-center justify-center overflow-hidden relative">
                                                {imgUrl ? (
                                                    <img
                                                        src={imgUrl}
                                                        alt={store.name}
                                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                        onError={(e) => {
                                                            e.target.style.display = 'none';
                                                            if (e.target.nextElementSibling) e.target.nextElementSibling.style.display = 'flex';
                                                        }}
                                                    />
                                                ) : null}
                                                <div className={`w-full h-full flex items-center justify-center ${imgUrl ? 'hidden' : ''}`}>
                                                    <span className="text-3xl">{store.category === '식당' ? '🍲' : store.category === '간식' ? '🥨' : '🏪'}</span>
                                                </div>
                                            </div>
                                            <div className="p-3 space-y-1 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <div className="text-[10px] text-[#b5926b] font-bold">{store.category}</div>
                                                    <div className="font-bold text-[14px] text-gray-900 truncate">{store.name}</div>
                                                    <div className="text-[11px] text-gray-500 truncate">{store.description || store.keywords || '상세보기'}</div>
                                                </div>
                                                <div className="pt-2 text-[10px] text-[#A68A64] font-bold flex items-center gap-0.5">
                                                    위치 보기 <ChevronRight className="w-3 h-3" />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="py-16 text-center space-y-3 bg-gray-50 rounded-2xl border border-gray-100">
                                <span className="text-4xl">🔍</span>
                                <h3 className="text-base font-bold text-gray-800">검색 조건에 맞는 점포가 없습니다</h3>
                                <p className="text-xs text-gray-500">카테고리를 바꾸거나 다른 단어로 검색해보세요.</p>
                                <button
                                    onClick={() => { setCategory('전체'); setSearch(''); }}
                                    className="px-4 py-2 bg-[#A68A64] text-white text-xs font-bold rounded-xl shadow-xs active:scale-95"
                                >
                                    전체 점포 보기
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Footer - Full Bleed */}
                    <footer className="mt-auto pt-8 pb-24 bg-gray-50 border-t border-gray-200/80 -mx-6 px-6 text-gray-500">
                        <div className="space-y-4">
                            <div className="flex items-center gap-2">
                                <img src="assets/mjlogo.png" alt="만장일치 로고" className="w-4 h-auto object-contain opacity-80" />
                                <span className="font-bold text-gray-800 text-sm" style={{ fontFamily: 'Jandari' }}>만장일치 (萬場一致)</span>
                            </div>

                            <div className="space-y-1 text-gray-500 leading-relaxed text-[11px]">
                                <p className="font-medium text-gray-700">통인시장 맞춤형 가이드 & 엽전도시락 서비스</p>
                                <p>위치: 서울특별시 종로구 자하문로15길 18 (통인동, 통인시장)</p>
                                <p>도시락카페 운영시간: 11:00 - 17:00 (월요일 & 3째주 일요일 휴무)</p>
                                <p>문의: 통인시장 고객만족센터 02-722-0936</p>
                            </div>

                            <div className="pt-3 border-t border-[#E8DEC9]/60 flex flex-col gap-2">
                                <div className="flex gap-3 text-[11px] text-gray-600 font-medium">
                                    <a href="stores.html" className="hover:text-[#A68A64] transition-colors">매장</a>
                                    <span>·</span>
                                    <a href="map.html" className="hover:text-[#A68A64] transition-colors">시장 지도</a>
                                    <span>·</span>
                                    <a href="markets.html" className="hover:text-[#A68A64] transition-colors">엽전도시락 가이드</a>
                                </div>
                                <p className="text-[10px] text-gray-400">© 2026 만장일치 (Manjanilchi). All rights reserved.</p>
                            </div>
                        </div>
                    </footer>
                    </div>

                    {/* Bottom Navigation Bar */}
                    <nav id="globalNavBar" className="fixed bottom-0 left-0 right-0 z-[60] flex justify-center pointer-events-none transition-transform duration-300">
                        <div className="w-full max-w-md bg-white border-t border-gray-100 flex justify-around items-center pb-[max(0.25rem,env(safe-area-inset-bottom))] pt-1.5 px-2 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] pointer-events-auto">
                            <button onClick={() => window.location.href = 'index.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
                                <span className="text-[9px] font-bold">홈</span>
                            </button>
                            <button className="flex flex-col items-center gap-0.5 p-1.5 text-gray-900 font-bold transition-colors">
                                <Store className="w-5 h-5 text-[#A68A64]" />
                                <span className="text-[9px] font-bold text-[#A68A64]">매장</span>
                            </button>
                            <button onClick={() => window.location.href = 'map.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                <MapPin className="w-5 h-5" />
                                <span className="text-[9px] font-bold">지도</span>
                            </button>
                            <button onClick={() => window.location.href = 'markets.html'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                <Coins className="w-5 h-5" />
                                <span className="text-[9px] font-bold">엽전도시락</span>
                            </button>
                            <button onClick={() => window.location.href = 'markets.html?view=facilities'} className="flex flex-col items-center gap-0.5 p-1.5 text-gray-400 hover:text-gray-900 transition-colors">
                                <Users className="w-5 h-5" />
                                <span className="text-[9px] font-bold">편의시설</span>
                            </button>
                        </div>
                    </nav>

                    <StoreDetailModal store={selectedStore} onClose={() => setSelectedStore(null)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StoresApp />);
    </script>
